# Daily encrypted backup of the Jo-CHF database, kept for 90 days as a workflow artifact.
# The file is encrypted with PII_KEY (AES-256), so it is safe even though the repository is public.
# Cloudflare D1 also keeps its own 30-day point-in-time history ("Time Travel").
name: Daily backup

on:
  schedule:
    - cron: "17 1 * * *"   # every day at 01:17 UTC (03:17 Jordan time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Export and encrypt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PII_KEY: ${{ secrets.PII_KEY }}
        working-directory: worker
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$PII_KEY" ]; then echo "Secrets not set yet. Skipping."; exit 0; fi
          export CLOUDFLARE_ACCOUNT_ID=$(curl -s https://api.cloudflare.com/client/v4/accounts -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||[];process.stdout.write(r.length?r[0].id:"")})')
          npm install --no-audit --no-fund
          STAMP=$(date -u +%Y-%m-%d)
          npx wrangler d1 export jo-chf --remote --output "jochf-$STAMP.sql"
          gzip "jochf-$STAMP.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "jochf-$STAMP.sql.gz" -out "jochf-$STAMP.sql.gz.enc" -pass env:PII_KEY
          rm "jochf-$STAMP.sql.gz"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: jochf-backup-${{ env.STAMP }}
          path: worker/jochf-*.sql.gz.enc
          retention-days: 90
          if-no-files-found: ignore
