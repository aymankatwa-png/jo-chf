# Cloudflare Worker for the Jo-CHF registry.
# Secrets are NOT stored here. PII_KEY (and optional BREVO_API_KEY) are GitHub repository secrets;
# the deploy workflow passes them to Cloudflare.
name = "jo-chf-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://aymankatwa-png.github.io"
SITE_URL = "https://aymankatwa-png.github.io/jo-chf/"
MAIL_FROM = "media@moomken.org"
MAIL_FROM_NAME = "Jo-CHF Registry"
PBKDF2_ITERATIONS = "100000"
ALLOW_LOCALHOST = "0"

[[d1_databases]]
binding = "DB"
database_name = "jo-chf"
database_id = "REPLACED_BY_DEPLOY_WORKFLOW"
