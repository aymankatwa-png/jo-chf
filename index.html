<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jo-CHF Registry</title>
  <meta name="description" content="Jordan Contemporary Heart Failure Registry: electronic data capture and live analytics.">
  <meta name="theme-color" content="#FBF6F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1020" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/bricolage-latin-wdth.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // apply saved theme before paint
    try { const t = localStorage.getItem('jochf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  </script>
  <script src="config.js"></script>
  <script defer src="assets/vendor/echarts.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <noscript>Jo-CHF needs JavaScript to run. Please enable it in your browser.</noscript>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
</body>
</html>
